<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lucas Sota | Tarjeta de presentación</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #10110f;
        --paper: #f1f0ea;
        --accent: #a970ff;
        --muted: #a8a9a3;
      }

      * {
        box-sizing: border-box;
      }

      @page {
        size: 85mm 55mm;
        margin: 0;
      }

      html,
      body {
        width: 85mm;
        height: 55mm;
        margin: 0;
      }

      body {
        background: var(--ink);
        color: var(--paper);
        font-family: "Manrope", sans-serif;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .card {
        position: relative;
        display: grid;
        width: 85mm;
        height: 55mm;
        grid-template-columns: minmax(0, 1fr) 19mm;
        grid-template-rows: auto 1fr auto;
        gap: 0 4.5mm;
        padding: 5mm;
        overflow: hidden;
        background:
          radial-gradient(circle at 82% 18%, rgba(169, 112, 255, 0.24), transparent 31%),
          linear-gradient(135deg, #181a16, var(--ink) 70%);
      }

      .card::after {
        position: absolute;
        inset: 0;
        opacity: 0.12;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E");
        content: "";
        pointer-events: none;
      }

      .card > * {
        position: relative;
        z-index: 1;
      }

      .topline {
        display: flex;
        grid-column: 1 / -1;
        align-items: center;
        justify-content: space-between;
        font: 500 2.05mm/1 "DM Mono", monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 1.6mm;
        color: var(--muted);
      }

      .status::before {
        width: 1.5mm;
        height: 1.5mm;
        border-radius: 50%;
        background: var(--accent);
        content: "";
      }

      .mark {
        font: 700 3.6mm/1 "Manrope", sans-serif;
        letter-spacing: -0.08em;
      }

      .mark span,
      .role {
        color: var(--accent);
      }

      .identity {
        align-self: center;
        min-width: 0;
        padding-top: 2mm;
      }

      h1 {
        margin: 0;
        font-size: 13.4mm;
        font-weight: 600;
        line-height: 0.74;
        letter-spacing: -0.085em;
      }

      h1 span {
        display: block;
      }

      h1 .outline {
        margin-left: 8mm;
        color: transparent;
        -webkit-text-stroke: 0.35mm var(--paper);
      }

      .role {
        margin: 3.5mm 0 0;
        font: 500 2.05mm/1.35 "DM Mono", monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .qr-panel {
        display: flex;
        align-self: end;
        flex-direction: column;
        gap: 1.7mm;
      }

      .qr-link {
        display: block;
        padding: 1.6mm;
        background: var(--paper);
      }

      .qr-link img {
        display: block;
        width: 100%;
        height: auto;
      }

      .qr-label {
        margin: 0;
        color: var(--muted);
        font: 1.65mm/1.35 "DM Mono", monospace;
        letter-spacing: 0.05em;
        text-align: center;
        text-transform: uppercase;
      }

      .contact {
        display: flex;
        grid-column: 1 / -1;
        align-items: end;
        justify-content: space-between;
        padding-top: 2.3mm;
        border-top: 0.25mm solid rgba(241, 240, 234, 0.34);
        font: 1.8mm/1.4 "DM Mono", monospace;
      }

      .contact p {
        margin: 0;
        color: var(--muted);
        text-transform: uppercase;
      }

      .links {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 0.4mm;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .web {
        border-bottom: 0.25mm solid var(--accent);
        color: var(--paper);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <header class="topline">
        <div class="mark">LS<span>R</span></div>
        <div class="status">Disponible para proyectos</div>
      </header>

      <section class="identity" aria-label="Identidad profesional">
        <h1><span>LUCAS</span><span class="outline">SOTA</span></h1>
        <p class="role">Editor de vídeo / Motion designer</p>
      </section>

      <aside class="qr-panel" aria-label="Acceso al porfolio">
        <a class="qr-link" href="https://lucassota.github.io/porfolio/">
          <img src="lucas-card-qr.svg" alt="Código QR del porfolio de Lucas Sota" />
        </a>
        <p class="qr-label">Escanea el<br />porfolio</p>
      </aside>

      <footer class="contact">
        <p>Madrid · España<br />Montaje · Ritmo · Narrativa</p>
        <div class="links">
          <a href="mailto:lukby13@gmail.com">lukby13@gmail.com</a>
          <a class="web" href="https://lucassota.github.io/porfolio/"
            >lucassota.github.io/porfolio ↗</a
          >
        </div>
      </footer>
    </main>
  </body>
</html>
